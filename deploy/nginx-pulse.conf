# Pulse phone surface: terminalless HTTPS in front of the SSH reverse tunnel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The CA certificate itself, served over plain HTTP on purpose.
    #
    # The only reason to fetch this file is that the phone does not yet trust this
    # host, so requiring HTTPS to download it would be a chicken-and-egg problem —
    # and the browser warning in the way is exactly the thing being worked around.
    # A certificate is public information (it is presented in every TLS handshake),
    # so there is no secret here to protect. It is not a redirect target because a
    # 301 would put the browser back on the untrusted host.
    location = /pulse-ca.crt {
        alias /etc/nginx/pulse-tls/server.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="pulse-ca.crt"';
        add_header Cache-Control 'no-store';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/pulse-tls/server.crt;
    ssl_certificate_key /etc/nginx/pulse-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The GUI's live session is a WebSocket; uploads can be large.
    client_max_body_size 512m;

    # The CA certificate itself, also served on 443 — and in practice this is the
    # one that works, because only 443 is open at the cloud security group.
    #
    # The browser will warn about the untrusted certificate on the way in. That is
    # expected and is precisely the problem being solved: tap through, and Android
    # offers to install this file as a trusted CA. Serving it from the same host it
    # certifies is honest — the file is public (it is presented in every TLS
    # handshake), and the alternative would be asking the user to move it by cable.
    location = /pulse-ca.crt {
        alias /etc/nginx/pulse-tls/server.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="pulse-ca.crt"';
        add_header Cache-Control 'no-store';
    }

    location / {
        proxy_pass http://127.0.0.1:3199;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, do not append. Pulse refuses its local-management subtree to
        # any request whose forwarded peer is not loopback, so this header is
        # security-relevant: with $proxy_add_x_forwarded_for a client could
        # prepend a forged "127.0.0.1" hop, and the header would also grow
        # without bound. $remote_addr is the one value a client cannot choose.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE and long-lived streams must not be buffered or timed out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
